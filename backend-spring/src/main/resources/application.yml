# Yawa Budget Spring Boot Backend Configuration
server:
  port: 8080

spring:
  application:
    name: yawa-budget-backend
  data:
    mongodb:
      # MongoDB connection URI configured via environment variable MONGODB_URI
      uri: ${MONGODB_URI:mongodb://localhost:27017/yawa_budget}

# JWT Security Configuration
app:
  jwt:
    # 256-bit secret key (min 32 chars) supplied via JWT_SECRET env var
    secret: ${JWT_SECRET:yawa-budget-super-secret-jwt-key-niit-defense-2026-minimum-256-bits!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

# Actuator Health Check Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
